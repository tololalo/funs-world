<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FunS Wallet - Coming Soon</title>
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#FF6B35">
    <meta name="description" content="FunS Wallet is coming soon. Stay tuned for the launch.">
    <meta property="og:title" content="FunS Wallet - Coming Soon">
    <meta property="og:description" content="FunS Wallet is coming soon. Stay tuned for the launch.">
    <meta property="og:image" content="https://funs.world/funs-nugi.png">
    <link rel="canonical" href="https://funs.world/wallet/app/">
    <link rel="alternate" hreflang="ko" href="https://funs.world/wallet/app/">
    <link rel="alternate" hreflang="en" href="https://funs.world/en/wallet/app/">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FF6B35;
            --secondary: #FFD700;
            --accent: #4FC3F7;
            --dark: #080B14;
            --dark2: #0D1120;
            --text: #FFFFFF;
            --text-mute: rgba(255, 255, 255, 0.65);
        }

        html, body {
            min-height: 100vh;
            background: var(--dark);
            color: var(--text);
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 107, 53, 0.18), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(79, 195, 247, 0.12), transparent 55%),
                linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 107, 53, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 107, 53, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 560px;
            width: 100%;
            text-align: center;
            padding: 32px 24px;
        }

        .logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.15), rgba(255, 215, 0, 0.08));
            border: 1px solid rgba(255, 107, 53, 0.35);
            box-shadow:
                0 20px 60px rgba(255, 107, 53, 0.25),
                inset 0 0 40px rgba(255, 107, 53, 0.08);
            margin-bottom: 32px;
            animation: float 4s ease-in-out infinite;
        }

        .logo-wrap img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(255, 107, 53, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(255, 107, 53, 0.12);
            border: 1px solid rgba(255, 107, 53, 0.4);
            color: var(--primary);
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: clamp(48px, 9vw, 84px);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FF6B35 0%, #FFD700 60%, #FF6B35 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            font-family: 'Orbitron', monospace;
            font-size: clamp(16px, 2.5vw, 20px);
            font-weight: 700;
            color: var(--text);
            margin-bottom: 24px;
            letter-spacing: 3px;
        }

        .desc {
            font-size: clamp(15px, 2.2vw, 17px);
            line-height: 1.7;
            color: var(--text-mute);
            margin-bottom: 40px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }

        .desc strong {
            color: var(--secondary);
            font-weight: 600;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #ff9a00);
            color: #fff;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(255, 107, 53, 0.5);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .lang-switch {
            display: inline-flex;
            gap: 6px;
            font-size: 13px;
            color: var(--text-mute);
            letter-spacing: 0.5px;
        }

        .lang-switch a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .lang-switch a:hover {
            text-decoration: underline;
        }

        .divider {
            opacity: 0.4;
        }

        @media (max-width: 480px) {
            .logo-wrap { width: 120px; height: 120px; border-radius: 28px; }
            .logo-wrap img { width: 78px; height: 78px; }
            .container { padding: 24px 16px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="logo-wrap">
            <img src="./icons/funs-nugi.png" alt="FunS Wallet" loading="eager">
        </div>

        <span class="badge">FunS Wallet</span>

        <h1>COMING SOON</h1>

        <p class="subtitle">곧 만나요</p>

        <p class="desc">
            <strong>FunS Wallet</strong>은 더 안전하고 빠른 멀티체인 경험을 위해<br>
            마지막 점검 중입니다. 정식 출시 소식을 가장 먼저 받아보세요.
        </p>

        <div class="actions">
            <a href="https://funs.world/" class="btn btn-primary">FunS 홈으로</a>
            <a href="https://funs.world/wallet/" class="btn btn-ghost">FunS Wallet 소개</a>
        </div>

        <div class="lang-switch">
            <span>Language</span>
            <span class="divider">·</span>
            <a href="https://funs.world/en/wallet/app/">English</a>
        </div>
    </main>
</body>
</html>
