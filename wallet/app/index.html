<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunS Wallet - Coming Soon</title>
    <meta name="theme-color" content="#FF6B35">
    <meta name="description" content="FunS Wallet - Coming Soon">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="canonical" href="https://funs.world/wallet/app/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #05070F;
            color: #EDF0F8;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            gap: 32px;
            position: relative;
            overflow: hidden;
        }

        /* Aurora backdrop (Design System v2) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 55% 42% at 12% -6%, rgba(255, 107, 53, 0.13) 0%, transparent 62%),
                radial-gradient(ellipse 48% 38% at 88% 12%, rgba(79, 195, 247, 0.09) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 50% 100%, rgba(255, 215, 0, 0.06) 0%, transparent 58%);
        }

        img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 44px rgba(255, 107, 53, 0.55));
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(40px, 8vw, 72px);
            font-weight: 900;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFD700 55%, #FF6B35 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 8px 40px rgba(255, 107, 53, 0.25));
        }

        @media (prefers-reduced-motion: reduce) {
            img { animation: none; }
        }
    </style>
</head>
<body>
    <img src="./icons/funs-nugi.png" alt="FunS Wallet">
    <h1>Coming Soon</h1>
</body>
</html>
